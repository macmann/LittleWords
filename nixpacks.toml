# Coolify builds/manages its own container; no Dockerfile is needed in this repo.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "exec node scripts/deploy.mjs"
